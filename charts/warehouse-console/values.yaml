# Default values for warehouse-console.

replicaCount: 1

image:
  repository: iqvo/warehouse-console
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# nginx-unprivileged runs as uid/gid 101 by default.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101

# Static content server with no need to write to its own root filesystem;
# nginx's runtime cache/pid dirs are provided as emptyDir volumes below
# instead so this can stay true (unlike the backend services' default of
# false, which they need for other reasons).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Runtime configuration served at /config.json from a ConfigMap, so ONE image
# serves any environment. apiOrigin is KONG's host entrypoint -- a different
# origin from the Nginx web gateway that serves this SPA, because the fleet
# keeps its two edges independent (Kong never serves assets; the web gateway
# never proxies an API). Kong carries the matching CORS policy for this page's
# origin.
runtimeConfig:
  enabled: true
  apiOrigin: "http://localhost:8000"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: warehouse-console.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
