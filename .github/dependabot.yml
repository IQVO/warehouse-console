version: 2
updates:

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # NOTE: the npm app tree here depends on file:../warehouse-ui-kit (a sibling repo). Dependabot cannot fetch
  # path dependencies outside the repository, so an npm entry for it fails on every run; security alerts
  # are fixed with scoped npm overrides instead (see the fleet recipe). repo_lint (R3) enforces this.
